[project]
name = "intelliquery"
version = "0.3.0"
description = "Multimodal, citation-grounded retrieval-augmented generation over your documents."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Zohreh Bayramalizadeh" }]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.121",
    "httpx>=0.27",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
# Document parsing pulls in PyTorch; only the ingestion worker needs it.
ingest = [
    "docling>=2.15",
    "pillow>=10.4",
    "torch>=2.4",
    "torchvision>=0.19",
]

[project.scripts]
intelliquery = "intelliquery.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

# On Linux, install CPU-only PyTorch wheels: the default wheels bundle several
# gigabytes of CUDA libraries that a CPU worker image never uses.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelliquery"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "ASYNC", "S", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

# Optional heavy dependencies: treated as untyped so results do not depend on
# whether the `ingest` extra is installed.
[[tool.mypy.overrides]]
module = ["docling.*", "docling_core.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs a running PostgreSQL with pgvector (set INTELLIQUERY_DATABASE_URL)",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["intelliquery"]
branch = true
