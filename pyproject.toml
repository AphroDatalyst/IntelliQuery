[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledgegraph-rag"
version = "0.1.0"
description = "Local AI Agent with RAG using Ollama, LangChain, and ChromaDB"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "KnowledgeGraph-RAG Contributors"}
]
keywords = ["rag", "llm", "ollama", "langchain", "chromadb", "vector-database", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "langchain>=0.1.0,<0.3.0",
    "langchain-community>=0.0.20,<0.3.0",
    "langchain-core>=0.1.0,<0.3.0",
    "langchain-text-splitters>=0.0.1",
    "ollama>=0.1.7",
    "chromadb>=0.4.22",
    "sentence-transformers>=2.2.2",
    "pypdf>=3.0.0",
    "pypdf2>=3.0.1",
    "unstructured>=0.11.0",
    "tiktoken>=0.5.2",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
ui = [
    "streamlit>=1.29.0",
]

[project.scripts]
rag-agent = "src.cli:main"
rag-ui = "run_ui:main"
rag-api = "run_api:main"

[project.urls]
Homepage = "https://github.com/your-username/KnowledgeGraph-RAG"
Documentation = "https://github.com/your-username/KnowledgeGraph-RAG#readme"
Repository = "https://github.com/your-username/KnowledgeGraph-RAG"
Issues = "https://github.com/your-username/KnowledgeGraph-RAG/issues"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-dir]
"" = "."

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

