name: intelliquery

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intelliquery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intelliquery}
      POSTGRES_DB: ${POSTGRES_DB:-intelliquery}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    # Built once here; the api service reuses the same image.
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    image: intelliquery-api:local
    command: ["alembic", "upgrade", "head"]
    environment: &api-env
      INTELLIQUERY_ENVIRONMENT: ${INTELLIQUERY_ENVIRONMENT:-local}
      INTELLIQUERY_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-intelliquery}:${POSTGRES_PASSWORD:-intelliquery}@postgres:5432/${POSTGRES_DB:-intelliquery}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: intelliquery-api:local
    pull_policy: never
    environment: *api-env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    image: intelliquery-worker:local
    # Model endpoints and keys come from .env; see .env.example.
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-env
      INTELLIQUERY_STORAGE_DIR: /var/lib/intelliquery/storage
      # Reach a model server running on the host (for example Ollama) by default.
      INTELLIQUERY_EMBEDDING_BASE_URL: ${INTELLIQUERY_EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
      INTELLIQUERY_VISION_BASE_URL: ${INTELLIQUERY_VISION_BASE_URL:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - storage-data:/var/lib/intelliquery/storage
      - model-cache:/var/lib/intelliquery/models
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  storage-data:
  model-cache:
